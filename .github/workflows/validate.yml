name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Test repository validator
        run: python -m unittest discover -s Tools/tests -v
      - name: Validate repository
        run: python Tools/validate_repository.py .
      - name: Test and rebuild analyzer
        run: dotnet test Packages/com.ryxinteractive.project-auditor-rules/Analyzer~/RyxInteractive.ProjectAuditorRules.CodeSizeAnalyzer.Tests.csproj --configuration Release
      - name: Ensure committed analyzer is current
        run: git diff --exit-code -- Packages/com.ryxinteractive.project-auditor-rules/RoslynAnalyzers/RyxInteractive.ProjectAuditorRules.CodeSizeAnalyzer.dll
