name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "9.0.301"
      - name: Test repository validator
        run: python -m unittest discover -s Tools/tests -v
      - name: Validate release tag
        run: python Tools/validate_repository.py . --expected-tag "$GITHUB_REF_NAME"
      - name: Test and rebuild analyzer
        run: dotnet test Packages/com.ryxinteractive.project-auditor-rules/Analyzer~/RyxInteractive.ProjectAuditorRules.CodeSizeAnalyzer.Tests.csproj --configuration Release
      - name: Ensure committed analyzer is current
        run: git diff --exit-code -- Packages/com.ryxinteractive.project-auditor-rules/RoslynAnalyzers/RyxInteractive.ProjectAuditorRules.CodeSizeAnalyzer.dll
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Ryx Project Auditor Rules $GITHUB_REF_NAME" --generate-notes
